<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<base href="__BASE__">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --rule: #d8dee4;
    --code-bg: #f6f8fa;
    --quote: #8b949e;
    --link: #0969da;
    --table-alt: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --rule: #30363d;
      --code-bg: #161b22;
      --quote: #6e7681;
      --link: #4493f8;
      --table-alt: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                 "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    margin: 0;
    padding: 48px 24px 96px;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1, h2, h3, h4 { line-height: 1.3; margin: 2em 0 .7em; font-weight: 600; }
  h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--rule); margin-top: 0; }
  h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--rule); }
  h3 { font-size: 1.25em; }
  p, ul, ol { margin: 0 0 1em; }
  li { margin: .25em 0; }
  a { color: var(--link); }
  hr { border: none; border-top: 1px solid var(--rule); margin: 2em 0; }
  blockquote {
    margin: 0 0 1em; padding: 0 1em;
    border-left: .25em solid var(--rule); color: var(--muted);
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: .88em;
    background: var(--code-bg);
    padding: .2em .4em; border-radius: 6px;
  }
  pre {
    background: var(--code-bg);
    padding: 16px; border-radius: 8px;
    overflow-x: auto; line-height: 1.55;
  }
  pre code { background: none; padding: 0; font-size: .85em; }
  table { border-collapse: collapse; margin: 0 0 1em; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--rule); padding: 7px 13px; }
  th { background: var(--table-alt); font-weight: 600; }
  tr:nth-child(2n) td { background: var(--table-alt); }
  img { max-width: 100%; }
  /* mermaid の図 */
  .mermaid {
    background: none;
    padding: 20px 0;
    text-align: center;
    overflow-x: auto;
  }
  .mermaid svg { max-width: 100%; height: auto; }
  .mermaid-error {
    background: var(--code-bg); border-left: 3px solid #d1242f;
    padding: 12px 16px; border-radius: 0 6px 6px 0; color: var(--muted);
    font-size: .9em; white-space: pre-wrap;
  }
  /* frontmatter を表形式のカードで見せる */
  .metadata {
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 4px 18px 14px;
    margin: 0 0 2em;
  }
  .metadata h2 {
    font-size: .78em; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    border: none; padding: 0; margin: 14px 0 10px;
  }
  .metadata dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  .metadata dt {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .85em; color: var(--link); white-space: nowrap;
  }
  .metadata dd { margin: 0; }
  .metadata pre { background: none; padding: 0; margin: 0; }
  /* 通常の描画では消えてしまう要素を、あえて見せる */
  .revealed {
    border-left: 3px solid var(--quote);
    background: var(--code-bg);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px; margin: 1em 0;
    font-size: .88em; color: var(--muted);
  }
  .revealed .revealed-label {
    display: block; font-size: .82em; letter-spacing: .05em;
    text-transform: uppercase; margin-bottom: 6px; opacity: .8;
  }
  .revealed pre { background: none; padding: 0; margin: 0; }
  footer {
    max-width: 860px; margin: 64px auto 0; padding-top: 16px;
    border-top: 1px solid var(--rule); color: var(--muted); font-size: .82em;
  }
</style>
</head>
<body>
<main><div id="metadata"></div><div id="content"></div></main>
<footer>__FOOTER__</footer>

<script id="md-source" type="application/octet-stream">__MD_B64__</script>
<script src="__LIB__/marked.umd.js"></script>
<script src="__LIB__/mermaid.min.js"></script>
<script>
(function () {
  // base64 -> UTF-8 文字列（日本語を壊さないため TextDecoder を使う）
  var b64 = document.getElementById('md-source').textContent.trim();
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var md = new TextDecoder('utf-8').decode(bytes);

  function escapeHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // --- frontmatter を本文から切り離し、メタデータのカードとして描く ---
  // marked に渡すと `---` が区切り線になって意味が失われるため、先に取り出す。
  function splitFrontmatter(text) {
    var lines = text.split(/\r?\n/);
    var delim = lines[0];
    if (delim !== '---' && delim !== '+++') return { meta: null, body: text };
    for (var i = 1; i < lines.length; i++) {
      if (lines[i] === delim) {
        return { meta: lines.slice(1, i).join('\n'), body: lines.slice(i + 1).join('\n') };
      }
    }
    return { meta: null, body: text };
  }

  var split = splitFrontmatter(md);

  if (split.meta !== null) {
    var dl = '';
    var pending = null;
    split.meta.split(/\r?\n/).forEach(function (line) {
      var m = line.match(/^([\w_.-]+):\s*(.*)$/);
      if (m) {
        if (pending) dl += '<dt>' + escapeHtml(pending.k) + '</dt><dd>' + escapeHtml(pending.v) + '</dd>';
        pending = { k: m[1], v: m[2] };
      } else if (pending && line.trim()) {
        pending.v += ' ' + line.trim();   // 複数行にまたがる値をつなぐ
      }
    });
    if (pending) dl += '<dt>' + escapeHtml(pending.k) + '</dt><dd>' + escapeHtml(pending.v) + '</dd>';
    document.getElementById('metadata').innerHTML =
      '<div class="metadata"><h2>メタデータ (frontmatter)</h2>' +
      (dl ? '<dl>' + dl + '</dl>' : '<pre>' + escapeHtml(split.meta) + '</pre>') + '</div>';
  }

  // マークダウンを描画
  document.getElementById('content').innerHTML = marked.parse(split.body, { gfm: true, breaks: false });

  // --- 通常なら消える要素を可視化する ---
  // HTMLコメントはブラウザでは見えないので、囲って見せる。
  (function revealComments(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT);
    var found = [];
    while (walker.nextNode()) found.push(walker.currentNode);
    found.forEach(function (node) {
      var box = document.createElement('div');
      box.className = 'revealed';
      box.innerHTML = '<span class="revealed-label">html コメント</span><pre></pre>';
      box.querySelector('pre').textContent = '<!--' + node.nodeValue + '-->';
      if (node.parentNode) node.parentNode.replaceChild(box, node);
    });
  })(document.getElementById('content'));

  // ```mermaid のコードブロックを mermaid の描画対象に置き換える
  document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
    var pre = code.parentElement;
    var holder = document.createElement('pre');
    holder.className = 'mermaid';
    holder.textContent = code.textContent;
    pre.replaceWith(holder);
  });

  // ページのテーマに図を合わせる
  var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
    securityLevel: 'loose',
  });

  mermaid.run({ querySelector: '.mermaid' }).catch(function (e) {
    // 図の記述に誤りがあっても、本文まで巻き添えにしない
    document.querySelectorAll('.mermaid').forEach(function (el) {
      if (!el.querySelector('svg')) {
        var box = document.createElement('div');
        box.className = 'mermaid-error';
        box.textContent = 'mermaid の描画に失敗しました:\n' + el.textContent;
        el.replaceWith(box);
      }
    });
  });
})();
</script>
</body>
</html>
